{% extends "base.html" %}

{% block content %}
<div class="container">
    <h2>{{ section.name }}</h2>

    {% for post in posts %}
        <article class="post">
            <p>{{ post.text }}</p>

            {% if post.image %}
                <img src="{{ post.image }}" alt="Post image">
            {% endif %}

            <div class="post-footer">
                <small>📅 {{ post.created_at }}</small>

                <form action="{{ url_for('delete_post', post_id=post.id) }}" method="POST">
                    <button type="submit" class="btn-delete" onclick="return confirm('Видалити цей пост?')">
                        Видалити
                    </button>
                </form>
            </div>
        </article>
    {% else %}
        <p style="text-align: center; color: #888;">У цьому розділі порожньо...</p>
    {% endfor %}
</div>
{% endblock %}
